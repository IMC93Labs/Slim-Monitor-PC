name: Build and publish release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Generate application icon
        shell: pwsh
        run: .\generate-icon.ps1

      - name: Restore
        run: dotnet restore SlimMonitorPC.csproj

      - name: Publish single-file EXE
        run: >-
          dotnet publish SlimMonitorPC.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Startup self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'publish\SlimMonitorPC.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Startup self-test failed with exit code $($process.ExitCode)."
          }

      - name: Verify embedded icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path 'publish\SlimMonitorPC.exe').Path
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) {
            throw 'The published EXE does not expose an embedded application icon.'
          }
          try {
            if ($icon.Width -lt 16 -or $icon.Height -lt 16) {
              throw "Unexpected embedded icon size: $($icon.Width)x$($icon.Height)."
            }
            Write-Host "Embedded icon verified: $($icon.Width)x$($icon.Height)"
          }
          finally {
            $icon.Dispose()
          }

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish\SlimMonitorPC.exe dist\SlimMonitorPC.exe
          $hash = (Get-FileHash dist\SlimMonitorPC.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SlimMonitorPC.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Item dist\SlimMonitorPC.exe | Format-List Name,Length
          Get-Content dist\SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlimMonitorPC-${{ steps.version.outputs.version }}-win-x64
          path: dist/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG dist\SlimMonitorPC.exe dist\SHA256SUMS.txt --title "Slim Monitor PC v$env:VERSION" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA
          } else {
            gh release upload $env:TAG dist\SlimMonitorPC.exe dist\SHA256SUMS.txt --clobber
          }
